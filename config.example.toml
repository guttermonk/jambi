# Jambi Configuration File
# Fast transcription using Vosk speech recognition
#
# Copy to ~/.config/jambi/config.toml to have it picked up automatically, or
# point at it explicitly with `jambi --config <path>`.
#
# NOTE: these top-level settings must stay above the first [table] header.
# A bare key after a header belongs to that table, so moving `mode` below
# [vosk] would quietly make it `vosk.mode` and have no effect.

# How jambi behaves when launched with no subcommand:
#
#   "windowed" - open the interactive TUI (the default, historical behaviour)
#   "live"     - hold-to-talk dictation: record while the key is held, then
#                type the transcription at the cursor
#
# Override for a single run with `jambi --mode live` / `--mode windowed`.
mode = "windowed"

# Also copy each transcription to the clipboard
auto_copy = true

# Keep the recorded .wav files after transcribing them
keep_recordings = false

[audio]
sample_rate = 16000
channels = 1
buffer_size = 1024
output_dir = "~/jambi_recordings"
# max_duration = 300  # Optional: uncomment to set max recording duration

[vosk]
# Vosk model selection
# Available models:
# - SmallEnUs: Small US English model (40MB) - fastest, good accuracy
# - LargeEnUs: Large US English model (1.8GB) - best accuracy
# - SmallEnIn: Small Indian English model (40MB)
# - SmallCn: Small Chinese model (40MB)
# - SmallRu: Small Russian model (40MB)
# - SmallFr: Small French model (40MB)
# - SmallDe: Small German model (40MB)
# - SmallEs: Small Spanish model (40MB)
# - SmallPt: Small Portuguese model (40MB)
# - SmallIt: Small Italian model (40MB)
# - SmallNl: Small Dutch model (40MB)
# - SmallJa: Small Japanese model (40MB)
model = "SmallEnUs"

# Sample rate for audio processing (typically 16000)
sample_rate = 16000.0

# Maximum alternatives to return (0 for single result)
max_alternatives = 0

# Whether to return word-level timestamps
show_words = true

# Whether to return partial results during recognition
partial_results = true

# Settings for live dictation (mode = "live"). Ignored in windowed mode.
[dictate]
# Milliseconds to wait after the recording stops before typing, so the
# hotkey's modifiers have time to come back up. Typing while Super is still
# held turns the text into compositor shortcuts instead of characters.
# Raise this if the first characters go missing or trigger keybinds.
modifier_grace_ms = 250

# Per-keystroke delay handed to wtype/xdotool. Some clients drop characters
# from a zero-delay burst; raise this if text arrives mangled.
type_delay_ms = 10

# How long `jambi dictate stop` waits for a recorder to appear before giving
# up. Covers a quick tap where the key is released while the model is still
# loading, so the stop would otherwise find nothing to signal.
stop_wait_ms = 2000

# Absolute path to the icon shown on notifications. Unset uses the glyph the
# package ships (white strokes, reads on a dark panel); an entry naming a file
# that does not exist falls back to no icon rather than a broken image.
#
# On a themed desktop, point this at the recoloured copy your theme generates
# and the notification follows your palette:
#   icon = "/home/you/.icons/microphone.svg"
# icon = ""
