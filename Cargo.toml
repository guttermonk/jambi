[package]
name = "jambi"
version = "0.1.0"
edition = "2021"
description = "High-performance voice transcription tool built with Rust"
license = "MIT OR Apache-2.0"
authors = ["Jambi Contributors"]
repository = "https://github.com/guttermonk/jambi"
readme = "README.md"
keywords = ["audio", "transcription", "vosk", "voice", "speech"]
categories = ["multimedia::audio", "command-line-utilities"]
default-run = "jambi"

[dependencies]
# Audio recording
cpal = "0.15"
hound = "3.5"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Speech recognition
vosk = "0.3"
zip = "0.6"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Clipboard integration
arboard = "3.3"

# HTTP client for model downloading
reqwest = { version = "0.11", features = ["json", "stream"] }
futures-util = "0.3"

# Configuration and serialization
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
serde_json = "1.0"

# System directories
dirs = "5.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# CLI interface
clap = { version = "4.4", features = ["derive"], optional = true }
nix = { version = "0.30.1", features = ["signal"] }

# System tray indicator for the daemon. StatusNotifierItem over D-Bus, the
# protocol Vorta/KeePassXC/OpenSnitch use, via zbus -- so no libdbus to link
# and nothing extra for the Nix build to find on the host.
ksni = { version = "0.3.6", default-features = false, features = ["tokio"], optional = true }

# Decoding for audio files that are not WAV. Pure Rust, so it compiles in
# rather than becoming a runtime dependency on ffmpeg -- which would be a
# ~100MB closure next to a 40MB model, and would put jambi back in the
# position of only working if the host happens to have the right tool built
# the right way.
#
# 0.5 rather than 0.6: same decoders, but an MSRV of 1.53 against 0.6's 1.85,
# which keeps the "Rust 1.70+" in the README true.
#
# Only the formats worth carrying. `isomp4`/`aac`/`alac` are the point of the
# exercise -- phones record m4a -- and the rest come close to free.
symphonia = { version = "0.5.4", optional = true, features = [
    "isomp4", "aac", "alac", "mpa", "aiff", "caf",
] }

[dev-dependencies]
# For tests
tempfile = "3.8"

# Main binary
[[bin]]
name = "jambi"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[profile.dev]
debug = true
opt-level = 0

# Feature flags
[features]
default = ["cli", "tray", "formats"]
cli = ["dep:clap"]
# Decode audio files that are not WAV: m4a, mp3, flac, ogg, opus, aiff, caf.
# On by default, because a phone's voice memo is an m4a and telling someone to
# go and convert it first is the barrier this removes. Turning it off leaves
# the WAV reader and an error naming the format and the ffmpeg line to fix it,
# so a minimal build degrades to saying what it cannot do.
formats = ["dep:symphonia"]
# Tray indicator for `jambi daemon`. On by default because a daemon you cannot
# see is a daemon you cannot tell is running; turn it off for a headless build,
# or leave it on and set `tray = false` under [daemon] to decide at runtime.
tray = ["dep:ksni"]
# openai = ["dep:reqwest"]  # Enable when needed
