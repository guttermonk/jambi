[package]
name = "jambi"
version = "0.1.0"
edition = "2021"
description = "High-performance voice transcription tool built with Rust"
license = "MIT OR Apache-2.0"
authors = ["Jambi Contributors"]
repository = "https://github.com/guttermonk/jambi"
readme = "README.md"
keywords = ["audio", "transcription", "vosk", "voice", "speech"]
categories = ["multimedia::audio", "command-line-utilities"]
default-run = "jambi"

[dependencies]
# Audio recording
cpal = "0.15"
hound = "3.5"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Speech recognition
vosk = "0.3"

# 9.x rather than 0.6: 0.6.6 is the subject of GHSA-8hxf-qr8p-62x4, an AES
# entry HMAC bypass, and 9.0.5 is the first fixed release. Dependabot could not
# propose it on its own -- its resolver capped at 7.2.0, below the fix.
#
# default-features = false drops aes-crypto, so the code that advisory is about
# is not compiled in at all rather than merely patched. What is left is deflate,
# which is what the Vosk model archives use. This is only reached when the
# `unzip` binary is missing or fails (see extract_zip_fallback), and a model
# archive compressed some other way would now fail there with an unsupported
# method error instead of extracting -- acceptable, as alphacep ships deflate.
zip = { version = "9", default-features = false, features = ["deflate"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Clipboard integration
arboard = "3.3"

# HTTP client for model downloading
reqwest = { version = "0.13", features = ["json", "stream"] }
futures-util = "0.3"

# Configuration and serialization
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
serde_json = "1.0"

# System directories
dirs = "7.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# CLI interface
clap = { version = "4.4", features = ["derive"], optional = true }
nix = { version = "0.31.3", features = ["signal"] }

# For `malloc_trim` alone, after the tray's off-click releases the warm model.
# Already in the tree as a transitive dependency of nix/cpal/tokio, so this
# costs a line in the manifest and nothing in the closure. See
# `daemon::release_warm_model` for why a plain drop is not enough.
libc = "0.2"

# System tray indicator for the daemon. StatusNotifierItem over D-Bus, the
# protocol Vorta/KeePassXC/OpenSnitch use, via zbus -- so no libdbus to link
# and nothing extra for the Nix build to find on the host.
ksni = { version = "0.3.6", default-features = false, features = ["tokio"], optional = true }

# Reading the desktop's colour scheme, so the tray glyph can follow a
# light/dark switch instead of being whatever ink the config named at startup.
# org.freedesktop.portal.Settings is the cross-desktop answer and carries a
# change signal, so there is nothing to poll.
#
# No new closure: ksni already pulls zbus for the StatusNotifierItem protocol,
# and this is the same version it resolved. Tied to the same feature, since
# without a tray there is nothing to recolour.
zbus = { version = "6", default-features = false, features = ["tokio"], optional = true }

# Decoding for audio files that are not WAV. Pure Rust, so it compiles in
# rather than becoming a runtime dependency on ffmpeg -- which would be a
# ~100MB closure next to a 40MB model, and would put jambi back in the
# position of only working if the host happens to have the right tool built
# the right way.
#
# 0.6 since the MSRV floor moved to 1.89 and stopped standing in the way; it
# was held at 0.5 to keep a "Rust 1.70+" README claim true against 0.6's 1.85.
# The move was not mechanical -- see decode_with_symphonia, where 0.6 renamed
# the probe and codec registry entry points and made next_packet report end of
# stream as Ok(None).
#
# Only the formats worth carrying. `isomp4`/`aac`/`alac` are the point of the
# exercise -- phones record m4a -- and the rest come close to free.
symphonia = { version = "0.6.1", optional = true, features = [
    "isomp4", "aac", "alac", "mpa", "aiff", "caf",
] }

[dev-dependencies]
# For tests
tempfile = "3.8"

# Main binary
[[bin]]
name = "jambi"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[profile.dev]
debug = true
opt-level = 0

# Feature flags
[features]
default = ["cli", "tray", "formats"]
cli = ["dep:clap"]
# Decode audio files that are not WAV: m4a, mp3, flac, ogg, opus, aiff, caf.
# On by default, because a phone's voice memo is an m4a and telling someone to
# go and convert it first is the barrier this removes. Turning it off leaves
# the WAV reader and an error naming the format and the ffmpeg line to fix it,
# so a minimal build degrades to saying what it cannot do.
formats = ["dep:symphonia"]
# Tray indicator for `jambi daemon`. On by default because a daemon you cannot
# see is a daemon you cannot tell is running; turn it off for a headless build,
# or leave it on and set `tray = false` under [daemon] to decide at runtime.
tray = ["dep:ksni", "dep:zbus"]
# openai = ["dep:reqwest"]  # Enable when needed
