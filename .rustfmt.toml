# Rustfmt configuration for Jambi
#
# Stable options only. This file previously set 14 more that exist solely on
# nightly rustfmt -- indent_style, wrap_comments, comment_width,
# imports_granularity, group_imports, trailing_comma, version,
# normalize_comments, format_strings, format_macro_bodies,
# format_macro_matchers, format_code_in_doc_comments and both
# blank_lines_* -- which the stable rustfmt in this flake ignores while
# printing a warning for each. The file read as though it enforced them, so
# removing them is the difference between describing the formatting and
# describing an intention.
#
# It also set `verbose = false`, which is not a formatting rule at all and
# wants a string rather than a boolean. That one was fatal: rustfmt failed to
# parse the file and gave up before formatting anything, so `cargo fmt` had
# been a no-op rather than a lenient pass.
#
# Note that the tree does not currently satisfy what remains -- `cargo fmt
# --check` reports a large diff, because nothing has ever successfully run
# against this file. Formatting the tree is a separate decision from having a
# config that parses.

# Maximum line width
max_width = 100

# Hard tabs vs spaces
hard_tabs = false

# Number of spaces per tab
tab_spaces = 4

# Newline style (Auto, Native, Unix, Windows)
newline_style = "Unix"

# Use field initialize shorthand if possible
use_field_init_shorthand = true

# Use try shorthand (?)
use_try_shorthand = true

# Remove nested parens
remove_nested_parens = true

# Reorder imports and module declarations
reorder_imports = true
reorder_modules = true

# Merge derives
merge_derives = true

# Match block trailing comma
match_block_trailing_comma = false

# Edition
edition = "2021"
