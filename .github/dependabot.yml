version: 2
updates:
  # jambi downloads Vosk models over HTTP and extracts them, so reqwest and
  # zip sit on the one code path here that handles bytes from the network.
  # Both are currently on EOL majors (reqwest 0.11, zip 0.6) -- expect the
  # first run to open major-bump PRs for them.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # One PR for the patch churn; minor and major get their own so the
    # download/extract crates are never bundled into a PR nobody reads.
    groups:
      patch:
        update-types:
          - "patch"

  # Actions referenced by .github/workflows/ci.yml. Grouped into one PR: these
  # are four pinned major tags that move together and nothing here depends on
  # their versions, so splitting them buys nothing.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
